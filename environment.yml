# Canonical paper environment — Shared Resources Planning (SRP1)
#
# Captured 2026-09-09 from the canonical runtime on the Mac Studio:
#   /Users/micaelsimoes/miniconda3/envs/opf_env_py311/bin/python
# (osx-arm64). The MacBook Air path /opt/anaconda3/envs/opf_env_py311 is the
# old machine's and is superseded.
#
# THE ENVIRONMENT IS HALF CONDA AND HALF PIP. This is not incidental and the
# split must be reproduced, not flattened:
#
#   * 46 packages come from conda (defaults, conda-forge, and the gurobi
#     channel);
#   * 23 packages come from pip, listed under the `pip:` key below and
#     mirrored in requirements.txt.
#
# The pip side carries load-bearing scientific packages, not just leaves:
# pandas 3.0.0, scipy 1.17.0, matplotlib, scikit-learn — and copulas 0.14.0,
# which is what generates the SRP1 stochastic scenario realization and
# therefore what the canonical checksum
#   5a02b77ccbbbbbb869de92958a3851d095624711abc2dbfc0157466064410358
# is a checksum OF. Installing copulas from a different source or version is
# a change to the paper instance, not a packaging detail.
#
# `pip list` reports 33 distributions rather than 23, because it also sees
# conda-installed Python packages (numpy, pyomo, packaging, psutil, ply,
# pandas-stubs, setuptools, wheel, pip, et_xmlfile) and gurobipy, which is
# delivered by the conda `gurobi` package. The 23 above is conda's own
# accounting of what pip actually installed.
#
# NOT CAPTURED HERE — the two solver components are outside conda and must be
# installed separately:
#
#   * IPOPT 3.14.18, ASL 20241111, standalone binary at /usr/local/bin/ipopt.
#     Note the `ipopt` entry below: conda-forge ships 3.14.19 (ASL 20231111)
#     into this environment. It is NOT the canonical solver, and it SHADOWS the
#     canonical one on PATH whenever the environment is activated. It is listed
#     because the manifest must record what is actually installed, not because
#     it should be used.
#
#     Production only ever invokes the locally installed binary: network.py:487
#     and shared_energy_storage_data.py:859 pass
#     executable=solver_params.solver_path, which SolverParameters reads from
#     NLP_SOLVER_PATH in .env with require_path=True. PATH is never consulted.
#     p54r_provenance.py asserts the resolved path, version and ASL build for
#     exactly this reason, and never falls back to a PATH lookup.
#   * HSL 5.5.0 providing ma97 (libcoinhsl in /usr/local/lib), licensed
#     separately and not redistributable.
#
# Recreate with:
#   conda env create -f environment.yml -n opf_env_py311
# then verify — do not assume — with:
#   python p54r_provenance.py
# which aborts unless the scenario checksum, IPOPT version, IPOPT ASL build
# and HSL linear solver all match the canonical values.

name: opf_env_py311

